{% extends "base.html" %}
{% block title %}学习首页 · 企业知识库{% endblock %}
{% block body %}
<div class="hero">
  <div class="hero-title">你好，{{ user.name }}</div>
  <div class="hero-sub">已完成证书 {{ total_certs }} 张 · 继续加油 💪</div>
</div>

<section class="section">
  <h2 class="section-title">学习分类</h2>
  <div class="cat-grid">
    {% for c in cards %}
    <a class="cat-card" href="{{ url_for('category', key=c.cat.key) }}">
      <div class="cat-icon">{{ c.cat.icon or '📁' }}</div>
      <div class="cat-name">{{ c.cat.name }}</div>
      <div class="cat-meta">{{ c.done }}/{{ c.total }} 门已完成</div>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
