{% extends "base.html" %}
{% set hide_topbar = true %}
{% block title %}登录 · 影响培训平台{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <img class="login-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="博阳能源 BROAD SUN">
    <div class="login-title">影响培训平台 · 学习平台</div>
    <p class="login-tip">输入姓名即可进入学习（生产环境自动识别企业微信身份）</p>
    <form method="post" class="login-form">
      <input name="name" placeholder="你的姓名" required>
      <input name="dept" placeholder="部门（选填）">
      <button class="btn btn-primary" type="submit">进入学习</button>
    </form>
    {% if users %}
    <div class="login-quick">
      <div class="login-quick-title">快速切换已有账号：</div>
      {% for u in users %}
      <a class="quick-user" href="{{ url_for('login', uid=u.id) }}">{{ u.name }}{% if u.dept %}({{ u.dept }}){% endif %}</a>
      {% endfor %}
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
